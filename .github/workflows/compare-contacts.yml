name: Leads pipeline (PhantomBuster export + contact comparison)

on:
  schedule:
    - cron: "30 6 * * *"          # daily, 06:30 UTC
  push:
    branches: [main]
    paths:
      - "data/**"                 # a new Contact List was uploaded
      - "compare/**"
      - "phantombuster/*.py"
      - "phantombuster/Mappings Final.xlsx"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild MYCF / Talent List from scratch (discards stored history)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: leads-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install LibreOffice (pre-calculates the report's formulas)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc

      # Step 1: refresh MYCF.xlsx, Talent List.xlsx (and YES!Delft) from PhantomBuster.
      # Written into phantombuster/, next to the script and Mappings Final.xlsx.
      - name: PhantomBuster export
        env:
          PHANTOMBUSTER_API_TOKEN: ${{ secrets.PHANTOMBUSTER_API_TOKEN }}
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            python phantombuster/phantombuster_tableau_main.py --rebuild
          else
            python phantombuster/phantombuster_tableau_main.py
          fi

      # Step 2: compare Contact List (data/) against the fresh MYCF + Talent List.
      - name: Contact comparison
        run: python compare/compare_contacts.py --repo-root . --output Contact_Comparison_Report.xlsx

      # Step 3: commit everything that was produced. The export's workbooks MUST be
      # committed, because the next run merges into them (that's where history lives).
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add phantombuster Contact_Comparison_Report.xlsx
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update PhantomBuster exports and contact comparison report"
            git pull --rebase
            git push
          fi
