name: Compare Contact Lists

# When this runs:
#  - automatically, whenever any .xlsx file changes on a push to main
#    (e.g. a fresh MYCF/Talent/Contact list export lands in the repo)
#  - manually, via the "Run workflow" button in the Actions tab
#  - on a weekly schedule (Monday 06:00 UTC), as a safety net in case a
#    file changes without triggering the push event (e.g. synced in by
#    Affinity-to-GoogleDrive rather than a normal git push)
on:
  push:
    branches: [main]
    paths:
      - "**/*.xlsx"
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

# Needed so the job can commit the generated report back to the repo.
permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pandas openpyxl matplotlib

      - name: Install LibreOffice (for formula recalculation)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Run comparison
        run: |
          python compare_contacts.py \
            --repo-root . \
            --output "Contact_Comparison_Report.xlsx"

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Contact_Comparison_Report.xlsx"
          git diff --cached --quiet || git commit -m "Update contact comparison report [skip ci]"
          git push

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: contact-comparison-report
          path: Contact_Comparison_Report.xlsx
